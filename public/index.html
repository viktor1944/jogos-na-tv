<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogos na TV · Bombacha</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1D9E75"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Bombacha"/>
  <link rel="apple-touch-icon" href="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg"/>
  <script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js'); }</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56; --green-text: #085041;
      --bg: #f7f7f5; --surface: #ffffff; --surface2: #f2f1ef;
      --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
      --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
      --radius: 8px; --radius-lg: 12px;
      --pink: #e91e8c; --pink-light: #fce4f3;
      --red: #e53935;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #252522; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.10); --border2: rgba(255,255,255,0.18);
        --text: #f0efe8; --text2: #b4b2a9; --text3: #888780;
        --green-light: #0a2e22; --green-text: #5DCAA5;
        --pink-light: #3a0a25;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* TOPBAR */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; height: 44px; position: sticky; top: 0; z-index: 100; }
    .topbar-title { display: flex; align-items: center; gap: 8px; }
    .topbar-title img { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--green); object-fit: cover; object-position: center top; }
    .topbar-title span { font-size: 15px; font-weight: 600; }
    .config-btn { background: none; border: none; cursor: pointer; color: var(--text2); padding: 6px; border-radius: var(--radius); transition: background 0.15s; display: flex; align-items: center; gap: 5px; font-size: 13px; }
    .config-btn:hover { background: var(--surface2); }
    .config-btn svg { width: 20px; height: 20px; }

    /* PAINEL CONFIG */
    .config-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; }
    .config-overlay.open { display: block; }
    .config-panel { position: fixed; top: 0; right: -100%; width: min(360px, 92vw); height: 100vh; background: var(--surface); z-index: 201; transition: right 0.25s cubic-bezier(.4,0,.2,1); overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
    .config-panel.open { right: 0; }
    .config-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .config-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .config-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text2); line-height: 1; }
    .config-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .config-section { display: flex; flex-direction: column; gap: 10px; }
    .config-section-title { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; }

    /* TIME FAVORITO */
    .fav-input-row { display: flex; gap: 8px; }
    .fav-input { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface2); color: var(--text); outline: none; }
    .fav-input:focus { border-color: var(--green); background: var(--surface); }
    .fav-add { padding: 8px 14px; font-size: 13px; background: var(--green); color: white; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; white-space: nowrap; }
    .fav-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .fav-tag { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; background: #fff0f0; border: 2px solid var(--red); font-size: 12px; color: var(--red); font-weight: 600; }
    .fav-tag button { background: none; border: none; cursor: pointer; color: var(--red); font-size: 15px; line-height: 1; padding: 0; margin-left: 2px; }

    /* COLORIR CAMPEONATOS */
    .color-row { display: flex; align-items: center; gap: 8px; }
    .color-select { flex: 1; padding: 7px 8px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface2); color: var(--text); outline: none; }
    .color-pick { width: 36px; height: 34px; border: 1px solid var(--border2); border-radius: var(--radius); cursor: pointer; padding: 2px; background: none; }
    .color-add { padding: 7px 12px; font-size: 13px; background: var(--green); color: white; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; white-space: nowrap; }
    .color-tags { display: flex; flex-direction: column; gap: 6px; }
    .color-tag { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); font-size: 12px; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .color-tag-name { flex: 1; font-weight: 500; }
    .color-tag button { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; line-height: 1; }

    .container { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 5rem; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 20px; font-weight: 600; }
    .subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .bombacha-header { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--green); overflow: hidden; flex-shrink: 0; box-shadow: 0 2px 8px rgba(29,158,117,0.3); transition: transform 0.2s; cursor: pointer; }
    .bombacha-header:hover { transform: scale(1.08) rotate(-3deg); }
    .bombacha-header img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .bombacha-float { position: fixed; bottom: 22px; right: 22px; z-index: 150; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bombacha-float-img { width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--green); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.25); transition: transform 0.2s; }
    .bombacha-float:hover .bombacha-float-img { transform: scale(1.1) rotate(5deg); }
    .bombacha-float-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .bombacha-label { background: var(--green); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.05em; }
    .refresh-btn { padding: 7px 14px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
    .refresh-btn:hover { background: var(--surface2); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spin { display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabs { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; width: fit-content; margin-bottom: 1.25rem; }
    .tab { padding: 8px 22px; font-size: 14px; color: var(--text2); background: var(--surface); border: none; cursor: pointer; transition: all 0.12s; }
    .tab.on { background: var(--surface2); color: var(--text); font-weight: 600; }
    .leagues-wrap { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 1.25rem; }
    .leagues-lbl { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--text); cursor: pointer; user-select: none; transition: all 0.1s; }
    .chip.on { background: var(--green-light); border-color: var(--green); color: var(--green-text); }
    .chip.feminino { color: var(--pink); border-color: var(--pink-light); }
    .chip.feminino.on { background: var(--pink-light); border-color: var(--pink); color: var(--pink); }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
    .chip.on .dot { background: var(--green); }
    .chip.feminino.on .dot { background: var(--pink); }
    .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
    .cb-row { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .cb-box { width: 17px; height: 17px; border-radius: 4px; border: 2px solid var(--border2); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; font-size: 11px; color: white; }
    .cb-row.checked .cb-box { background: var(--green); border-color: var(--green); }
    .cb-row.nofem.checked .cb-box { background: var(--red); border-color: var(--red); }
    .cb-row span { font-size: 13px; color: var(--text2); }
    .cb-row.nofem span { color: var(--red); font-weight: 700; }
    .stat { font-size: 12px; color: var(--text3); margin-bottom: 1rem; }
    .glist { display: flex; flex-direction: column; gap: 5px; }
    .gc { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 11px 14px; display: flex; align-items: flex-start; gap: 12px; transition: all 0.15s; }
    .gc.favorito { border-width: 2px; border-color: var(--red); box-shadow: 0 2px 12px rgba(229,57,53,0.15); }
    .gc.favorito .gt { color: var(--red) !important; }
    .fav-badge { font-size: 10px; font-weight: 700; color: var(--red); background: #ffe0e0; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
    .gt { font-size: 13px; font-weight: 600; color: var(--green-dark); min-width: 42px; flex-shrink: 0; padding-top: 1px; }
    .gm { flex: 1; min-width: 0; }
    .gn { font-size: 14px; font-weight: 500; color: var(--text); }
    .gl { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .gl.fem { color: var(--pink); }
    .gtv { font-size: 11px; color: var(--text2); background: var(--surface2); border-radius: 4px; padding: 3px 8px; margin-top: 4px; display: inline-block; word-break: break-word; white-space: normal; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
    .loading { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .loading-spinner { width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .error { background: #FCEBEB; border: 1px solid #F09595; border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: #791F1F; margin-bottom: 1rem; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-title">
    <img src="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg" alt="Bombacha"/>
    <span>Jogos na TV</span>
  </div>
  <button class="config-btn" onclick="openConfig()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Configurações
  </button>
</div>

<!-- OVERLAY + PAINEL CONFIG -->
<div class="config-overlay" id="overlay" onclick="closeConfig()"></div>
<div class="config-panel" id="configPanel">
  <div class="config-header">
    <h2>⚙️ Configurações</h2>
    <button class="config-close" onclick="closeConfig()">×</button>
  </div>
  <div class="config-body">

    <!-- TIME FAVORITO -->
    <div class="config-section">
      <div class="config-section-title">⭐ Meu time favorito</div>
      <div class="fav-input-row">
        <input class="fav-input" id="favInput" type="text" placeholder="Ex: Flamengo..." onkeydown="if(event.key==='Enter')addFav()"/>
        <button class="fav-add" onclick="addFav()">+ Add</button>
      </div>
      <div class="fav-tags" id="favTags"></div>
    </div>

    <!-- COLORIR CAMPEONATOS -->
    <div class="config-section">
      <div class="config-section-title">🎨 Colorir campeonatos</div>
      <div class="color-row">
        <select class="color-select" id="colorSelect">
          <option value="">Escolha um campeonato...</option>
        </select>
        <input class="color-pick" type="color" id="colorPick" value="#1D9E75"/>
        <button class="color-add" onclick="addColor()">+ Add</button>
      </div>
      <div class="color-tags" id="colorTags"></div>
    </div>

  </div>
</div>

<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="bombacha-header">
        <img src="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg" alt="Bombacha"/>
      </div>
      <div>
        <h1>Jogos na TV</h1>
        <div class="subtitle" id="updatedAt">com Bombacha ⚽</div>
      </div>
    </div>
    <button class="refresh-btn" id="refBtn" onclick="load()">
      <span id="refIcon">&#8635;</span> Atualizar
    </button>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="swTab('hoje')" id="tH">Hoje</button>
    <button class="tab" onclick="swTab('amanha')" id="tA">Amanhã</button>
  </div>

  <div id="errorBox" class="error" style="display:none;"></div>
  <div id="stat" class="stat"></div>

  <div class="leagues-wrap" id="leaguesWrap" style="display:none;">
    <div class="leagues-lbl">Campeonatos <span id="lcnt"></span></div>
    <div class="chips" id="chps"></div>
    <div class="actions">
      <div class="cb-row" id="rowAll" onclick="onAll()">
        <div class="cb-box" id="boxAll"></div><span>Marcar todos</span>
      </div>
      <div class="cb-row" id="rowNone" onclick="onNone()">
        <div class="cb-box" id="boxNone"></div><span>Desmarcar todos</span>
      </div>
      <div class="cb-row nofem" id="rowNoFem" onclick="onNoFem()">
        <div class="cb-box" id="boxNoFem"></div>
        <span>🚫 Não quero ver NADA de futebol feminino! 😂</span>
      </div>
    </div>
  </div>

  <div id="out"></div>
</div>

<div class="bombacha-float" onclick="load()" title="Atualizar jogos">
  <div class="bombacha-float-img">
    <img src="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg" alt="Bombacha"/>
  </div>
  <div class="bombacha-label">AO VIVO</div>
</div>

<script>
  var data = { hoje: [], amanha: [] };
  var tab = 'hoje';
  var active = new Set();
  var leagues = new Set();
  var noFem = false;
  var favTimes = [];
  var leagueColors = {}; // { 'Brasileirão': '#ff0000' }

  var PRIORITY = [
    'copa do mundo','mundial de clubes','champions league','libertadores',
    'eurocopa','copa america','copa américa','brasileirao','brasileirão',
    'serie a','série a','serie b','série b','copa do brasil',
    'sulamericana','sul-americana','premier league','la liga','laliga','bundesliga'
  ];

  function leaguePriority(n) {
    n = n.toLowerCase();
    for (var i=0;i<PRIORITY.length;i++) if(n.indexOf(PRIORITY[i])!==-1) return i;
    return 999;
  }

  function isFem(n) {
    n=(n||'').toLowerCase();
    return n.indexOf('feminino')!==-1||n.indexOf('feminina')!==-1||n.indexOf('nwsl')!==-1;
  }

  function isFavGame(teams, league) {
    if (!favTimes.length) return false;
    if (noFem && isFem(league)) return false;
    var t=(teams||'').toLowerCase();
    return favTimes.some(function(f){ return t.indexOf(f.toLowerCase())!==-1; });
  }

  function hexToRgba(hex, alpha) {
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+alpha+')';
  }

  // Storage
  function ls(k,v) { try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} }
  function loadSaved() { try{return JSON.parse(ls('jogos_off')||'[]');}catch(e){return[];} }
  function loadNoFem() { return ls('jogos_nofem')==='true'; }
  function loadFavs() { try{return JSON.parse(ls('jogos_favs')||'[]');}catch(e){return[];} }
  function loadColors() { try{return JSON.parse(ls('jogos_colors')||'{}');}catch(e){return{};} }

  function savePref() {
    try {
      var off=Array.from(leagues).filter(function(l){return !active.has(l);});
      ls('jogos_off',JSON.stringify(off));
      ls('jogos_nofem',noFem?'true':'false');
      ls('jogos_favs',JSON.stringify(favTimes));
      ls('jogos_colors',JSON.stringify(leagueColors));
    }catch(e){}
  }

  // Config panel
  function openConfig() {
    document.getElementById('overlay').classList.add('open');
    document.getElementById('configPanel').classList.add('open');
    renderColorSelect();
  }
  function closeConfig() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('configPanel').classList.remove('open');
  }

  // Favoritos
  function addFav() {
    var inp=document.getElementById('favInput'), val=inp.value.trim();
    if(!val) return;
    if(favTimes.map(function(f){return f.toLowerCase();}).indexOf(val.toLowerCase())===-1){
      favTimes.push(val); savePref(); renderFavTags(); render();
    }
    inp.value='';
  }
  function removeFav(i) { favTimes.splice(i,1); savePref(); renderFavTags(); render(); }
  function renderFavTags() {
    var box=document.getElementById('favTags'); box.innerHTML='';
    favTimes.forEach(function(f,i){
      var t=document.createElement('div'); t.className='fav-tag';
      t.innerHTML='⭐ '+f+'<button onclick="removeFav('+i+')">×</button>';
      box.appendChild(t);
    });
  }

  // Cores de campeonato
  function renderColorSelect() {
    var sel=document.getElementById('colorSelect');
    var cur=sel.value;
    sel.innerHTML='<option value="">Escolha um campeonato...</option>';
    Array.from(leagues).sort().forEach(function(l){
      var o=document.createElement('option');
      o.value=l; o.textContent=l+(leagueColors[l]?' ✓':'');
      sel.appendChild(o);
    });
    if(cur) sel.value=cur;
    // atualiza cor do picker se campeonato já tem cor
    sel.onchange=function(){
      if(leagueColors[sel.value]) document.getElementById('colorPick').value=leagueColors[sel.value];
    };
    renderColorTags();
  }
  function addColor() {
    var sel=document.getElementById('colorSelect'), pick=document.getElementById('colorPick');
    if(!sel.value) return;
    leagueColors[sel.value]=pick.value;
    savePref(); renderColorSelect(); render();
  }
  function removeColor(l) { delete leagueColors[l]; savePref(); renderColorSelect(); render(); }
  function renderColorTags() {
    var box=document.getElementById('colorTags'); box.innerHTML='';
    Object.keys(leagueColors).forEach(function(l){
      var div=document.createElement('div'); div.className='color-tag';
      div.innerHTML='<div class="color-dot" style="background:'+leagueColors[l]+'"></div>'+
        '<span class="color-tag-name">'+l+'</span>'+
        '<button onclick="removeColor(\''+l.replace(/'/g,"\\'")+'\')" >×</button>';
      box.appendChild(div);
    });
  }

  function swTab(t) {
    tab=t;
    document.getElementById('tH').className='tab'+(t==='hoje'?' on':'');
    document.getElementById('tA').className='tab'+(t==='amanha'?' on':'');
    buildLeagues(); render();
  }

  function buildLeagues() {
    leagues=new Set(data[tab].map(function(g){return g.league;}).filter(Boolean));
    var off=loadSaved(); active=new Set();
    leagues.forEach(function(l){ if(off.indexOf(l)===-1) active.add(l); });
    if(noFem) leagues.forEach(function(l){ if(isFem(l)) active.delete(l); });
  }

  function onAll() { leagues.forEach(function(l){ if(!noFem||!isFem(l)) active.add(l); }); savePref(); render(); }
  function onNone() { active.clear(); savePref(); render(); }
  function onNoFem() {
    noFem=!noFem;
    if(noFem) leagues.forEach(function(l){ if(isFem(l)) active.delete(l); });
    savePref(); render();
  }

  function timeToMin(t) { var p=t.replace('h',':').split(':'); return parseInt(p[0])*60+parseInt(p[1]||0); }
  function fmtLeague(n) { return (n||'').replace(/(feminino|feminina)/gi,'<span style="color:var(--pink);font-weight:600">$1</span>'); }

  function render() {
    var allOn=leagues.size>0&&Array.from(leagues).filter(function(l){return !noFem||!isFem(l);}).every(function(l){return active.has(l);});
    var noneOn=leagues.size>0&&active.size===0;
    document.getElementById('rowAll').className='cb-row'+(allOn?' checked':'');
    document.getElementById('boxAll').textContent=allOn?'✓':'';
    document.getElementById('rowNone').className='cb-row'+(noneOn?' checked':'');
    document.getElementById('boxNone').textContent=noneOn?'✓':'';
    document.getElementById('rowNoFem').className='cb-row nofem'+(noFem?' checked':'');
    document.getElementById('boxNoFem').textContent=noFem?'✓':'';

    var lbox=document.getElementById('chps'), wrap=document.getElementById('leaguesWrap');
    lbox.innerHTML='';
    if(leagues.size===0){ wrap.style.display='none'; }
    else {
      wrap.style.display='block';
      var sorted=Array.from(leagues).sort(function(a,b){
        var fa=isFem(a),fb=isFem(b);
        if(fa&&!fb) return 1; if(!fa&&fb) return -1;
        var pa=leaguePriority(a),pb=leaguePriority(b);
        if(pa!==pb) return pa-pb; return a.localeCompare(b);
      });
      sorted.forEach(function(l){
        var fem=isFem(l), cor=leagueColors[l];
        var c=document.createElement('div');
        c.className='chip'+(active.has(l)?' on':'')+(fem?' feminino':'');
        if(cor && active.has(l)) { c.style.background=hexToRgba(cor,0.15); c.style.borderColor=cor; c.style.color=cor; }
        c.innerHTML='<span class="dot"'+(cor&&active.has(l)?' style="background:'+cor+'"':'')+'></span>'+(fem?l.replace(/(feminino|feminina)/gi,'<span style="color:var(--pink);font-weight:600">$1</span>'):l);
        c.onclick=function(){ active.has(l)?active.delete(l):active.add(l); savePref(); render(); };
        lbox.appendChild(c);
      });
      document.getElementById('lcnt').textContent=active.size+'/'+leagues.size;
    }

    var games=data[tab]
      .filter(function(g){ return !g.league||active.has(g.league); })
      .sort(function(a,b){
        var fa=isFavGame(a.teams,a.league), fb=isFavGame(b.teams,b.league);
        if(fa&&!fb) return -1; if(!fa&&fb) return 1;
        return timeToMin(a.time)-timeToMin(b.time);
      });

    document.getElementById('stat').textContent=games.length+' jogo'+(games.length!==1?'s':'')+' · mantosdofutebol.com.br';

    if(!games.length){ document.getElementById('out').innerHTML='<div class="empty">Nenhum jogo para os campeonatos selecionados.</div>'; return; }

    var h='<div class="glist">';
    games.forEach(function(g){
      var fem=isFem(g.league||'');
      var fav=isFavGame(g.teams,g.league);
      var cor=leagueColors[g.league||''];
      var style='';
      if(fav) {
        style='background:#fff5f5;border:2px solid var(--red);box-shadow:0 2px 12px rgba(229,57,53,0.15);';
      } else if(cor) {
        style='background:'+hexToRgba(cor,0.08)+';border-color:'+cor+';border-width:2px;';
      }
      h+='<div class="gc'+(fav?' favorito':'')+'"'+(style?' style="'+style+'"':'')+'>'+
        '<div class="gt" '+(cor&&!fav?'style="color:'+cor+'"':'')+'>'+g.time+'</div>'+
        '<div class="gm">'+
          '<div class="gn">'+g.teams+(fav?'<span class="fav-badge">⭐ MEU TIME</span>':'')+'</div>'+
          '<div class="gl'+(fem?' fem':'')+'"'+(cor&&!fav?' style="color:'+cor+';opacity:0.8"':'')+'>'+fmtLeague(g.league||'')+'</div>'+
          (g.tv?'<div class="gtv">'+g.tv+'</div>':'')+
        '</div>'+
      '</div>';
    });
    h+='</div>';
    document.getElementById('out').innerHTML=h;
  }

  async function load() {
    var btn=document.getElementById('refBtn'),icon=document.getElementById('refIcon');
    btn.disabled=true; icon.className='spin';
    document.getElementById('errorBox').style.display='none';
    document.getElementById('out').innerHTML='<div class="loading"><div class="loading-spinner"></div><div>Bombacha buscando os jogos...</div></div>';
    document.getElementById('leaguesWrap').style.display='none';
    document.getElementById('stat').textContent='';
    try {
      var res=await fetch('/api/jogos');
      if(!res.ok) throw new Error('Erro '+res.status);
      var json=await res.json();
      data.hoje=json.hoje||[]; data.amanha=json.amanha||[];
      noFem=loadNoFem(); favTimes=loadFavs(); leagueColors=loadColors();
      if(json.updatedAt){
        var d=new Date(json.updatedAt);
        document.getElementById('updatedAt').textContent='com Bombacha · atualizado '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      }
      buildLeagues(); renderFavTags(); render();
    } catch(e){
      document.getElementById('out').innerHTML='';
      document.getElementById('errorBox').style.display='block';
      document.getElementById('errorBox').textContent='Erro ao buscar jogos: '+e.message;
    }
    btn.disabled=false; icon.className='';
  }

  load();
  setInterval(load,60*60*1000);
</script>
</body>
</html>
