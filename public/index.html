<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogos na TV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-dark: #0F6E56;
      --green-text: #085041;
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface2: #f2f1ef;
      --border: rgba(0,0,0,0.10);
      --border2: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text2: #5f5e5a;
      --text3: #888780;
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #252522;
        --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.10);
        --border2: rgba(255,255,255,0.18);
        --text: #f0efe8;
        --text2: #b4b2a9;
        --text3: #888780;
        --green-light: #0a2e22;
        --green-text: #5DCAA5;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .ball {
      width: 32px; height: 32px;
      background: var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    h1 { font-size: 22px; font-weight: 600; }

    .updated {
      font-size: 12px;
      color: var(--text3);
    }

    .refresh-btn {
      padding: 7px 14px;
      font-size: 13px;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.15s;
    }
    .refresh-btn:hover { background: var(--surface2); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spin { display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      width: fit-content;
      margin-bottom: 1.25rem;
    }
    .tab {
      padding: 8px 22px;
      font-size: 14px;
      color: var(--text2);
      background: var(--surface);
      border: none;
      cursor: pointer;
      transition: all 0.12s;
    }
    .tab.on {
      background: var(--surface2);
      color: var(--text);
      font-weight: 600;
    }

    .leagues-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 1.25rem;
    }
    .leagues-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .chip.on {
      background: var(--green-light);
      border-color: var(--green);
      color: var(--green-text);
    }
    .chip .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border2);
      flex-shrink: 0;
    }
    .chip.on .dot { background: var(--green); }
    .qbtns { display: flex; gap: 12px; margin-top: 8px; }
    .qbtn {
      font-size: 12px; color: var(--text3);
      background: none; border: none;
      cursor: pointer; text-decoration: underline; padding: 0;
    }
    .qbtn:hover { color: var(--text2); }

    .stat {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 1rem;
    }

    .sec {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .glist {
      display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px;
    }
    .gc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .gt {
      font-size: 13px; font-weight: 600;
      color: var(--green-dark);
      min-width: 42px; flex-shrink: 0;
    }
    .gm { flex: 1; min-width: 0; }
    .gn {
      font-size: 14px; font-weight: 500;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gtv {
      font-size: 11px; color: var(--text2);
      background: var(--surface2);
      border-radius: 4px;
      padding: 3px 8px;
      white-space: nowrap; flex-shrink: 0;
      max-width: 160px; overflow: hidden; text-overflow: ellipsis;
    }

    .empty {
      text-align: center; padding: 3rem 1rem;
      color: var(--text3); font-size: 14px;
    }
    .loading {
      text-align: center; padding: 3rem 1rem;
      color: var(--text3); font-size: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .loading-spinner {
      width: 30px; height: 30px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .error {
      background: #FCEBEB; border: 1px solid #F09595;
      border-radius: var(--radius); padding: 12px 14px;
      font-size: 13px; color: #791F1F; margin-bottom: 1rem;
    }

    @media (max-width: 480px) {
      .gn { font-size: 13px; }
      .gtv { max-width: 110px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="ball">⚽</div>
      <div>
        <h1>Jogos na TV</h1>
        <div class="updated" id="updatedAt"></div>
      </div>
    </div>
    <button class="refresh-btn" id="refBtn" onclick="load()">
      <span id="refIcon">↻</span> Atualizar
    </button>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="sw('hoje')" id="tH">Hoje</button>
    <button class="tab" onclick="sw('amanha')" id="tA">Amanhã</button>
  </div>

  <div id="errorBox" class="error" style="display:none;"></div>
  <div id="stat" class="stat"></div>

  <div class="leagues-wrap" id="leaguesWrap" style="display:none;">
    <div class="leagues-lbl">Campeonatos <span id="lcnt"></span></div>
    <div class="chips" id="chps"></div>
    <div class="qbtns">
      <button class="qbtn" onclick="all()">marcar todos</button>
      <button class="qbtn" onclick="none()">desmarcar todos</button>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
  let data = { hoje: [], amanha: [] };
  let tab = 'hoje';
  let active = new Set();
  let leagues = new Set();

  function sw(t) {
    tab = t;
    document.getElementById('tH').className = 'tab' + (t === 'hoje' ? ' on' : '');
    document.getElementById('tA').className = 'tab' + (t === 'amanha' ? ' on' : '');
    buildLeagues();
    render();
  }

  function buildLeagues() {
    leagues = new Set(data[tab].map(g => g.league).filter(Boolean));
    active = new Set([...leagues]);
  }

  function all() { leagues.forEach(l => active.add(l)); render(); }
  function none() { active.clear(); render(); }

  function render() {
    const lbox = document.getElementById('chps');
    const wrap = document.getElementById('leaguesWrap');
    lbox.innerHTML = '';
    if (leagues.size === 0) { wrap.style.display = 'none'; }
    else {
      wrap.style.display = 'block';
      [...leagues].sort().forEach(l => {
        const c = document.createElement('div');
        c.className = 'chip' + (active.has(l) ? ' on' : '');
        c.innerHTML = '<span class="dot"></span>' + l;
        c.onclick = () => { active.has(l) ? active.delete(l) : active.add(l); render(); };
        lbox.appendChild(c);
      });
      document.getElementById('lcnt').textContent = active.size + '/' + leagues.size;
    }

    const games = data[tab].filter(g => !g.league || active.has(g.league));
    document.getElementById('stat').textContent = games.length + ' jogo' + (games.length !== 1 ? 's' : '') + ' · mantosdofutebol.com.br';

    const byL = {};
    games.forEach(g => {
      const k = g.league || 'Outros';
      if (!byL[k]) byL[k] = [];
      byL[k].push(g);
    });

    let h = '';
    if (!games.length) {
      h = '<div class="empty">Nenhum jogo para os campeonatos selecionados.</div>';
    } else {
      Object.entries(byL).forEach(([l, gs]) => {
        h += `<div class="sec">${l}</div><div class="glist">`;
        gs.forEach(g => {
          h += `<div class="gc">
            <div class="gt">${g.time}</div>
            <div class="gm"><div class="gn">${g.teams}</div></div>
            ${g.tv ? `<div class="gtv">${g.tv}</div>` : ''}
          </div>`;
        });
        h += '</div>';
      });
    }
    document.getElementById('out').innerHTML = h;
  }

  async function load() {
    const btn = document.getElementById('refBtn');
    const icon = document.getElementById('refIcon');
    btn.disabled = true;
    icon.className = 'spin';
    icon.textContent = '↻';
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('out').innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>Buscando jogos...</div></div>';
    document.getElementById('leaguesWrap').style.display = 'none';
    document.getElementById('stat').textContent = '';

    try {
      const res = await fetch('/api/jogos');
      if (!res.ok) throw new Error('Erro ' + res.status);
      const json = await res.json();

      data.hoje = json.hoje || [];
      data.amanha = json.amanha || [];

      if (json.updatedAt) {
        const d = new Date(json.updatedAt);
        document.getElementById('updatedAt').textContent =
          'atualizado ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }

      buildLeagues();
      render();
    } catch (e) {
      document.getElementById('out').innerHTML = '';
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorBox').textContent = 'Erro ao buscar jogos: ' + e.message;
    }

    btn.disabled = false;
    icon.className = '';
  }

  load();

  // Atualiza automaticamente a cada 1 hora
  setInterval(load, 60 * 60 * 1000);
</script>
</body>
</html>
