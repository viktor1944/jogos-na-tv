<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogos na TV · Bombacha</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1D9E75"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Bombacha"/>
  <link rel="apple-touch-icon" href="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg"/>
  <script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js'); }</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56; --green-text: #085041;
      --bg: #f7f7f5; --surface: #ffffff; --surface2: #f2f1ef;
      --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
      --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
      --radius: 8px; --radius-lg: 12px;
      --pink: #e91e8c; --pink-light: #fce4f3;
      --red: #e53935;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #252522; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.10); --border2: rgba(255,255,255,0.18);
        --text: #f0efe8; --text2: #b4b2a9; --text3: #888780;
        --green-light: #0a2e22; --green-text: #5DCAA5;
        --pink-light: #3a0a25;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 5rem; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 20px; font-weight: 600; }
    .subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .bombacha-header { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--green); overflow: hidden; flex-shrink: 0; box-shadow: 0 2px 8px rgba(29,158,117,0.3); transition: transform 0.2s; cursor: pointer; }
    .bombacha-header:hover { transform: scale(1.08) rotate(-3deg); }
    .bombacha-header img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .bombacha-float { position: fixed; bottom: 22px; right: 22px; z-index: 999; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bombacha-float-img { width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--green); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.25); transition: transform 0.2s; }
    .bombacha-float:hover .bombacha-float-img { transform: scale(1.1) rotate(5deg); }
    .bombacha-float-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .bombacha-label { background: var(--green); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.05em; }
    .refresh-btn { padding: 7px 14px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
    .refresh-btn:hover { background: var(--surface2); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spin { display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabs { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; width: fit-content; margin-bottom: 1.25rem; }
    .tab { padding: 8px 22px; font-size: 14px; color: var(--text2); background: var(--surface); border: none; cursor: pointer; transition: all 0.12s; }
    .tab.on { background: var(--surface2); color: var(--text); font-weight: 600; }
    .leagues-wrap { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 1.25rem; }
    .leagues-lbl { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--text); cursor: pointer; user-select: none; transition: all 0.1s; }
    .chip.on { background: var(--green-light); border-color: var(--green); color: var(--green-text); }
    .chip.feminino { color: var(--pink); border-color: var(--pink-light); }
    .chip.feminino.on { background: var(--pink-light); border-color: var(--pink); color: var(--pink); }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
    .chip.on .dot { background: var(--green); }
    .chip.feminino.on .dot { background: var(--pink); }
    .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
    .cb-row { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .cb-box { width: 17px; height: 17px; border-radius: 4px; border: 2px solid var(--border2); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; font-size: 11px; color: white; }
    .cb-row.checked .cb-box { background: var(--green); border-color: var(--green); }
    .cb-row.nofem.checked .cb-box { background: var(--red); border-color: var(--red); }
    .cb-row span { font-size: 13px; color: var(--text2); }
    .cb-row.nofem span { color: var(--red); font-weight: 700; }
    .stat { font-size: 12px; color: var(--text3); margin-bottom: 1rem; }
    .glist { display: flex; flex-direction: column; gap: 5px; }
    .gc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; display: flex; align-items: flex-start; gap: 12px; }
    .gt { font-size: 13px; font-weight: 600; color: var(--green-dark); min-width: 42px; flex-shrink: 0; padding-top: 1px; }
    .gm { flex: 1; min-width: 0; }
    .gn { font-size: 14px; font-weight: 500; color: var(--text); }
    .gl { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .gl.fem { color: var(--pink); }
    .gtv { font-size: 11px; color: var(--text2); background: var(--surface2); border-radius: 4px; padding: 3px 8px; margin-top: 4px; display: inline-block; word-break: break-word; white-space: normal; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
    .loading { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .loading-spinner { width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .error { background: #FCEBEB; border: 1px solid #F09595; border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: #791F1F; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="bombacha-header">
        <img src="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg" alt="Bombacha"/>
      </div>
      <div>
        <h1>Jogos na TV</h1>
        <div class="subtitle" id="updatedAt">com Bombacha ⚽</div>
      </div>
    </div>
    <button class="refresh-btn" id="refBtn" onclick="load()">
      <span id="refIcon">&#8635;</span> Atualizar
    </button>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="sw('hoje')" id="tH">Hoje</button>
    <button class="tab" onclick="sw('amanha')" id="tA">Amanhã</button>
  </div>

  <div id="errorBox" class="error" style="display:none;"></div>
  <div id="stat" class="stat"></div>

  <div class="leagues-wrap" id="leaguesWrap" style="display:none;">
    <div class="leagues-lbl">Campeonatos <span id="lcnt"></span></div>
    <div class="chips" id="chps"></div>
    <div class="actions">
      <div class="cb-row" id="rowAll" onclick="onAll()">
        <div class="cb-box" id="boxAll"></div>
        <span>Marcar todos</span>
      </div>
      <div class="cb-row" id="rowNone" onclick="onNone()">
        <div class="cb-box" id="boxNone"></div>
        <span>Desmarcar todos</span>
      </div>
      <div class="cb-row nofem" id="rowNoFem" onclick="onNoFem()">
        <div class="cb-box" id="boxNoFem"></div>
        <span>🚫 Não quero ver NADA de futebol feminino! 😂</span>
      </div>
    </div>
  </div>

  <div id="out"></div>
</div>

<div class="bombacha-float" onclick="load()" title="Atualizar jogos">
  <div class="bombacha-float-img">
    <img src="https://i.ibb.co/205HWkcP/photo-2026-04-27-02-41-19.jpg" alt="Bombacha"/>
  </div>
  <div class="bombacha-label">AO VIVO</div>
</div>

<script>
  var data = { hoje: [], amanha: [] };
  var tab = 'hoje';
  var active = new Set();
  var leagues = new Set();
  var noFem = false;

  var PRIORITY = [
    'copa do mundo','mundial de clubes','champions league','libertadores',
    'eurocopa','copa america','copa américa','brasileirao','brasileirão',
    'serie a','série a','serie b','série b','copa do brasil',
    'sulamericana','sul-americana','premier league','la liga','laliga',
    'bundesliga'
  ];

  function leaguePriority(name) {
    var n = name.toLowerCase();
    for (var i = 0; i < PRIORITY.length; i++) {
      if (n.indexOf(PRIORITY[i]) !== -1) return i;
    }
    return 999;
  }

  function isFem(name) {
    var n = (name||'').toLowerCase();
    return n.indexOf('feminino')!==-1 || n.indexOf('feminina')!==-1 ||
           n.indexOf('nwsl')!==-1 || n.indexOf('inglês feminino')!==-1;
  }

  function loadSaved() {
    try { return JSON.parse(localStorage.getItem('jogos_off')||'[]'); } catch(e) { return []; }
  }
  function loadNoFem() {
    try { return localStorage.getItem('jogos_nofem')==='true'; } catch(e) { return false; }
  }
  function savePref() {
    try {
      var off = Array.from(leagues).filter(function(l){ return !active.has(l); });
      localStorage.setItem('jogos_off', JSON.stringify(off));
      localStorage.setItem('jogos_nofem', noFem?'true':'false');
    } catch(e){}
  }

  function sw(t) {
    tab = t;
    document.getElementById('tH').className = 'tab'+(t==='hoje'?' on':'');
    document.getElementById('tA').className = 'tab'+(t==='amanha'?' on':'');
    buildLeagues(); render();
  }

  function buildLeagues() {
    leagues = new Set(data[tab].map(function(g){ return g.league; }).filter(Boolean));
    var off = loadSaved();
    active = new Set();
    leagues.forEach(function(l){
      if (off.indexOf(l)===-1) active.add(l);
    });
    if (noFem) leagues.forEach(function(l){ if(isFem(l)) active.delete(l); });
  }

  function onAll() {
    leagues.forEach(function(l){ if(!noFem||!isFem(l)) active.add(l); });
    savePref(); render();
  }

  function onNone() {
    active.clear();
    savePref(); render();
  }

  function onNoFem() {
    noFem = !noFem;
    if (noFem) leagues.forEach(function(l){ if(isFem(l)) active.delete(l); });
    savePref(); render();
  }

  function timeToMin(t) {
    var p = t.replace('h',':').split(':');
    return parseInt(p[0])*60+parseInt(p[1]||0);
  }

  function fmtLeague(name) {
    return (name||'').replace(/(feminino|feminina)/gi,'<span style="color:var(--pink);font-weight:600">$1</span>');
  }

  function render() {
    var allOn = Array.from(leagues).filter(function(l){ return !noFem||!isFem(l); }).every(function(l){ return active.has(l); }) && leagues.size > 0;
    var noneOn = active.size === 0 && leagues.size > 0;

    document.getElementById('rowAll').className = 'cb-row'+(allOn?' checked':'');
    document.getElementById('boxAll').textContent = allOn?'✓':'';
    document.getElementById('rowNone').className = 'cb-row'+(noneOn?' checked':'');
    document.getElementById('boxNone').textContent = noneOn?'✓':'';
    document.getElementById('rowNoFem').className = 'cb-row nofem'+(noFem?' checked':'');
    document.getElementById('boxNoFem').textContent = noFem?'✓':'';

    var lbox = document.getElementById('chps');
    var wrap = document.getElementById('leaguesWrap');
    lbox.innerHTML = '';
    if (leagues.size===0) { wrap.style.display='none'; return; }
    wrap.style.display = 'block';

    var sorted = Array.from(leagues).sort(function(a,b){
      var fa=isFem(a), fb=isFem(b);
      if(fa&&!fb) return 1; if(!fa&&fb) return -1;
      var pa=leaguePriority(a), pb=leaguePriority(b);
      if(pa!==pb) return pa-pb;
      return a.localeCompare(b);
    });

    sorted.forEach(function(l){
      var fem=isFem(l);
      var c=document.createElement('div');
      c.className='chip'+(active.has(l)?' on':'')+(fem?' feminino':'');
      c.innerHTML='<span class="dot"></span>'+(fem?l.replace(/(feminino|feminina)/gi,'<span style="color:var(--pink);font-weight:600">$1</span>'):l);
      c.onclick=function(){ active.has(l)?active.delete(l):active.add(l); savePref(); render(); };
      lbox.appendChild(c);
    });
    document.getElementById('lcnt').textContent=active.size+'/'+leagues.size;

    var games=data[tab]
      .filter(function(g){ return !g.league||active.has(g.league); })
      .sort(function(a,b){ return timeToMin(a.time)-timeToMin(b.time); });

    document.getElementById('stat').textContent=games.length+' jogo'+(games.length!==1?'s':'')+' · mantosdofutebol.com.br';

    if(!games.length){
      document.getElementById('out').innerHTML='<div class="empty">Nenhum jogo para os campeonatos selecionados.</div>';
      return;
    }
    var h='<div class="glist">';
    games.forEach(function(g){
      var fem=isFem(g.league||'');
      h+='<div class="gc"><div class="gt">'+g.time+'</div><div class="gm">'+
        '<div class="gn">'+g.teams+'</div>'+
        '<div class="gl'+(fem?' fem':'')+'">'+fmtLeague(g.league||'')+'</div>'+
        (g.tv?'<div class="gtv">'+g.tv+'</div>':'')+
        '</div></div>';
    });
    h+='</div>';
    document.getElementById('out').innerHTML=h;
  }

  async function load() {
    var btn=document.getElementById('refBtn'), icon=document.getElementById('refIcon');
    btn.disabled=true; icon.className='spin';
    document.getElementById('errorBox').style.display='none';
    document.getElementById('out').innerHTML='<div class="loading"><div class="loading-spinner"></div><div>Bombacha buscando os jogos...</div></div>';
    document.getElementById('leaguesWrap').style.display='none';
    document.getElementById('stat').textContent='';
    try {
      var res=await fetch('/api/jogos');
      if(!res.ok) throw new Error('Erro '+res.status);
      var json=await res.json();
      data.hoje=json.hoje||[]; data.amanha=json.amanha||[];
      noFem=loadNoFem();
      if(json.updatedAt){
        var d=new Date(json.updatedAt);
        document.getElementById('updatedAt').textContent='com Bombacha · atualizado '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      }
      buildLeagues(); render();
    } catch(e){
      document.getElementById('out').innerHTML='';
      document.getElementById('errorBox').style.display='block';
      document.getElementById('errorBox').textContent='Erro ao buscar jogos: '+e.message;
    }
    btn.disabled=false; icon.className='';
  }

  load();
  setInterval(load, 60*60*1000);
</script>
</body>
</html>
